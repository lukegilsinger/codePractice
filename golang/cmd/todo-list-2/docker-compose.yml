version: '3.8'

services:
  # Development with SQLite
  app-sqlite:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=./data/todos.db
      - LOG_LEVEL=debug
      - JWT_SECRET=local-dev-secret
      - ENVIRONMENT=development
    volumes:
      - ./data:/app/data
    profiles:
      - sqlite

  # Development with PostgreSQL
  app-postgres:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://todouser:todopass@postgres:5432/todos?sslmode=disable
      - LOG_LEVEL=debug
      - JWT_SECRET=local-dev-secret
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todo-network
    profiles:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d todos"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  postgres_data:

networks:
  todo-network:
    driver: bridge